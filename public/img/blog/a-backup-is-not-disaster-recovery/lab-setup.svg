    <path d="M522 320 Q560 296 606 268" stroke="#E8590C" stroke-width="3.2" stroke-dasharray="8 7"/>
    <path d="M588 268 Q598 267 606 268 Q601 276 598 285" stroke="#E8590C" stroke-width="3.2"/>
