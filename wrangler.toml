# Cloudflare Pages config for blog.kubesimplify.com (project "website").
#
# The project is Git-connected: every push to main triggers a Pages build
# (`npm run build` → /out) and deploy. Because pages_build_output_dir is set,
# Pages reads this file during CI and applies the bindings below — no
# dashboard configuration needed.
#
# Routing + the first-party analytics API live in public/_worker.js
# (Pages Advanced Mode), auto-generated by scripts/generate-redirects.mjs
# from worker/analytics.js. The DASH_PASSWORD secret is set once via:
#   npx wrangler pages secret put DASH_PASSWORD --project-name website

name = "website"
pages_build_output_dir = "./out"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "blog-analytics"
database_id = "571fa71d-0cd7-43b7-aaf3-5f2601bf12d0"
